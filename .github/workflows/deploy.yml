name: Deploy Slidev Presentation to GitHub Pages & Export PDF

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install

      - name: Install Playwright Chromium for PDF Export
        run: npx playwright install chromium --with-deps

      - name: Build Slidev Web App
        run: pnpm run build

      - name: Export Presentation to PDF
        run: pnpm run export --output ./dist/slides.pdf

      - name: Upload PDF Artifact for Release Download
        uses: actions/upload-artifact@v4
        with:
          name: presentation-pdf
          path: ./dist/slides.pdf

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
