name: Deploy Slidev Presentation & Export PDF

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright Chromium for PDF Export
        run: npx playwright install chromium --with-deps

      - name: Build Slidev Web App
        run: pnpm run build

      - name: Export Presentation to PDF
        run: pnpm run export --output ./dist/slides.pdf

      - name: Upload PDF Artifact for Release Download
        uses: actions/upload-artifact@v4
        with:
          name: presentation-pdf
          path: ./dist/slides.pdf

      - name: Deploy to GitHub Pages Branch (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
